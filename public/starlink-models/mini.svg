<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" role="img" aria-label="Starlink Mini">
  <defs>
    <linearGradient id="miniBody" x1="40" y1="30" x2="200" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="miniFace" x1="60" y1="40" x2="180" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="miniGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 95) rotate(90) scale(70)">
      <stop stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="208" height="168" rx="28" fill="#020617" opacity=".45"/>
  <ellipse cx="120" cy="168" rx="58" ry="8" fill="#000" opacity=".35"/>
  <!-- kickstand -->
  <path d="M78 148 L92 112 L148 112 L162 148 Z" fill="#111827"/>
  <rect x="68" y="48" width="104" height="104" rx="18" fill="url(#miniBody)" stroke="#475569" stroke-width="2"/>
  <rect x="78" y="58" width="84" height="84" rx="12" fill="url(#miniFace)"/>
  <circle cx="120" cy="100" r="70" fill="url(#miniGlow)"/>
  <circle cx="120" cy="100" r="26" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" opacity=".9"/>
  <circle cx="120" cy="100" r="10" fill="#22d3ee" opacity=".55"/>
  <text x="120" y="186" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Mini</text>
</svg>
